  vc-2:  {asset: "diagnostic_data", threats: ["T"], note: "WebView loadUrl 미검증 — FP CONFIRMED (4중 차단)"}
  vc-3:  {asset: "user_credentials", threats: ["E"], note: "AppPermissionManager grantRuntimePermission caller-controlled pkg — FP CONFIRMED (NavRouter binding 부재)"}
  vc-4:  {asset: "user_credentials", threats: ["E", "D"], note: "revokeRuntimePermission 동일 — FP CONFIRMED"}
  vc-5:  {asset: "vehicle_control", threats: ["I"], note: "GleoActionSender implicit broadcast — TP CONFIRMED, response JSON 외부 가시"}
  vc-6:  {asset: "vehicle_control", threats: ["S", "T"], note: "VehicleBroadcastReceiver macAddress 미검증 — TP CONFIRMED, exported"}
  vc-7:  {asset: "diagnostic_data", threats: ["I"], note: "registerReceiver flag 미지정 — TP LOW (API 34 hardening)"}
  ssl-1: {asset: "user_credentials", threats: ["I"], note: "ECCCrypto KDF (BuildConfig.IDENTIFIER) — TP HIGH, 모든 device 동일 키"}
  ssl-2: {asset: "user_credentials", threats: ["I"], note: "AuthData.toString() — TP HIGH, logcat 누출 가능"}
  ssl-3: {asset: "diagnostic_data", threats: ["I"], note: "CCGAuthenticator hardcoded endpoint + secret POST — TP MEDIUM"}
  lmp-1: {asset: "llm_corpus", threats: ["I"], note: "PromptsContentProvider exported — TP HIGH, prompt injection chain"}
  lmp-2: {asset: "llm_corpus", threats: ["D"], note: "LLMModelProviderReceiver 외부 앱 모델 삭제/process kill — TP MEDIUM"}
  ssl-4: {asset: "pii", threats: ["I"], note: "HmgUserInfo PII toString — TP HIGH, GDPR/개인정보보호법"}
  ssl-5: {asset: "user_credentials", threats: ["I"], note: "BuildConfig.IDENTIFIER as KDF passphrase — TP HIGH, ssl-1과 동일 chain의 hardcoded layer"}
  ssl-6: {asset: "diagnostic_data", threats: ["I", "T"], note: "gRPC .usePlaintext() — TP HIGH, 평문 syslog + systemID"}
  ucl1-1: {asset: "user_credentials", threats: ["I"], note: "UnCrackable Level1 hardcoded AES key (sg.vantagepoint.uncrackable1.C0005a:15) — TP HIGH, MASVS-CRYPTO-1 / MASVS-STORAGE-2"}
  ucl1-2: {asset: "user_credentials", threats: ["I"], note: "UnCrackable Level1 weak crypto (sg.vantagepoint.p000a.C0000a:15) — TP MEDIUM, MASVS-CRYPTO-1"}
  ucl1-3: {asset: "user_credentials", threats: ["I"], note: "UnCrackable Level1 unsafe storage (sg.vantagepoint.uncrackable1.C0005a:17) — TP LOW, MASVS-STORAGE-3"}
  ucl3-1: {asset: "user_credentials", threats: ["I"], note: "UnCrackable Level3 hardcoded XOR key passed to native init (sg.vantagepoint.uncrackable3.MainActivity:25) — TP HIGH, MASVS-CRYPTO-1 / MASVS-STORAGE-2"}

